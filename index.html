<script type="module">
import*as THREE from './lib/three.module.min.js';
const $=s=>document.querySelector(s),rnd=(a,b)=>a+Math.random()*(b-a),cl=(v,a,b)=>Math.max(a,Math.min(b,v)),lp=(a,b,t)=>a+(b-a)*t,pick=a=>a[Math.random()*a.length|0];
const DEPTH=350,FOV=50;

function wc(y){const t=cl(-y/DEPTH,0,1),a=new THREE.Color('#37b9f5'),b=new THREE.Color('#0a5a9c'),c=new THREE.Color('#03142e');return t<.3?a.lerp(b,t/.3):b.lerp(c,(t-.3)/.7)}

bgG.setAttribute('color',new THREE.Float32BufferAttribute(bgc,3));
const backdrop=new THREE.Mesh(bgG,new THREE.MeshBasicMaterial({vertexColors:true,fog:false}));backdrop.position.z=-90;SC.add(backdrop);
const sunM=new THREE.Mesh(new THREE.CircleGeometry(14,32),new THREE.MeshBasicMaterial({color:0xfff6c0,fog:false}));sunM.position.set(50,70,-85);SC.add(sunM);
const clouds=[];for(let i=0;i<7;i++){const g=new THREE.Group();for(let j=0;j<4;j++)g.add(sphere(rnd(5,9),new THREE.MeshBasicMaterial({color:0xffffff,fog:false,transparent:true,opacity:.92}),j*7-10,rnd(-2,2),0,1.3,.8,.6));g.position.set(i*70-210,rnd(40,90),-80);SC.add(g);clouds.push(g)}
const WX=[],wg=new THREE.PlaneGeometry(500,72,125,14);wg.rotateX(-Math.PI/2);wg.translate(0,0,-24);
const water=new THREE.Mesh(wg,new THREE.MeshBasicMaterial({color:0x6fd6ff,transparent:true,opacity:.5,side:THREE.DoubleSide,fog:false,depthWrite:false}));SC.add(water);
const fg=new THREE.PlaneGeometry(500,3,125,1);fg.rotateX(-Math.PI/2);fg.translate(0,.05,11);
const foam=new THREE.Mesh(fg,new THREE.MeshBasicMaterial({color:0xffffff,transparent:true,opacity:.85,fog:false,depthWrite:false}));SC.add(foam);
const wv=(x,t)=>Math.sin(x*.15+t*1.6)*.35+Math.sin(x*.37+t*2.3)*.15;
const rayT=(()=>{const c=document.createElement('canvas');c.width=4;c.height=128;const x=c.getContext('2d'),g=x.createLinearGradient(0,0,0,128);g.addColorStop(0,'#fff');g.addColorStop(1,'#0000');x.fillStyle=g;x.fillRect(0,0,4,128);return new THREE.CanvasTexture(c)})();
const rays=[];for(let i=0;i<6;i++){const m=new THREE.Mesh(new THREE.PlaneGeometry(rnd(5,12),90),new THREE.MeshBasicMaterial({map:rayT,transparent:true,opacity:.1,blending:THREE.AdditiveBlending,depthWrite:false,fog:false,side:THREE.DoubleSide}));m.position.set(i*28-70,-40,-20-i*3);m.rotation.z=.35;SC.add(m);rays.push(m)}
const floor=new THREE.Mesh(new THREE.PlaneGeometry(800,200),MS_({color:'#b59d6a',roughness:1}));floor.rotation.x=-Math.PI/2;floor.position.set(0,-DEPTH,-60);SC.add(floor);
const decor=[];
function rock(r,col){const g=new THREE.IcosahedronGeometry(r,1),p=g.attributes.position;for(let i=0;i<p.count;i++){const x=p.getX(i),y=p.getY(i),z=p.getZ(i),f=1+.28*Math.sin(x*1.3+y*1.1+z*.9);p.setXYZ(i,x*f,y*f*.7,z*f)}g.computeVertexNormals();return new THREE.Mesh(g,MS_({color:col,flatShading:true,roughness:.9}))}

for(let i=0;i<26;i++){const o=rock(rnd(8,18),'#27323d');o.position.set(rnd(-160,160),rnd(-DEPTH+10,-20),rnd(-75,-45));SC.add(o);decor.push(o)}
const ptT=(()=>{const c=document.createElement('canvas');c.width=c.height=64;const x=c.getContext('2d'),g=x.createRadialGradient(32,32,0,32,32,32);g.addColorStop(0,'#fff');g.addColorStop(.5,'#fff8');g.addColorStop(1,'#0000');x.fillStyle=g;x.fillRect(0,0,64,64);return new THREE.CanvasTexture(c)})();

const NB=140,bP=new Float32Array(NB*3),bC=new Float32Array(NB*3).fill(.45),bO=[];for(let i=0;i<NB;i++)bO.push([rnd(-50,50),rnd(-28,28),rnd(-25,10),rnd(.6,2)]);
const bG=new THREE.BufferGeometry();bG.setAttribute('position',new THREE.BufferAttribute(bP,3));bG.setAttribute('color',new THREE.BufferAttribute(bC,3));const bub=new THREE.Points(bG,pm(.7));bub.frustumCulled=false;SC.add(bub);
const MX=600,fP=new Float32Array(MX*3),fC=new Float32Array(MX*3),fxs=[];const fG=new THREE.BufferGeometry();fG.setAttribute('position',new THREE.BufferAttribute(fP,3));fG.setAttribute('color',new THREE.BufferAttribute(fC,3));const fxP=new THREE.Points(fG,pm(.9));fxP.frustumCulled=false;SC.add(fxP);
function fx(x,y,z,vx,vy,vz,l,col,g=0){if(fxs.length<MX){const c=new THREE.Color(col);fxs.push({x,y,z,vx,vy,vz,l,L:l,r:c.r,g:c.g,b:c.b,gr:g})}}
function splash(x,y,v){for(let i=0;i<30;i++)fx(x+rnd(-1,1),y,rnd(-1,1),rnd(-4,4),rnd(2,Math.min(16,Math.abs(v)*.7+4)),rnd(-2,2),rnd(.6,1.2),'#e6f8ff',-22)}
/* school of background fish (shared geometry) */
const school=[];

/* ---------- procedural creatures ---------- */
function fishM(L,top,bel,o={}){const G=new THREE.Group(),w=o.w||.34,geo=new THREE.SphereGeometry(1,20,14);geo.scale(L,L*w,L*w*.75);
 const p=geo.attributes.position,cs=[],a=new THREE.Color(top),b=new THREE.Color(bel);
 for(let i=0;i<p.count;i++){const c=a.clone().lerp(b,cl(.5-p.getY(i)/(L*w)*1.6,0,1));cs.push(c.r,c.g,c.b)}
 geo.setAttribute('color',new THREE.Float32BufferAttribute(cs,3));
 G.add(new THREE.Mesh(geo,bend(MS_({vertexColors:true,roughness:.4,emissive:o.em||'#000',emissiveIntensity:.5}),L,0)));
 const fm=bend(MS_({color:top,side:THREE.DoubleSide,roughness:.5,emissive:o.em||'#000',emissiveIntensity:.3}),L,0),h=L*w;
 let s=new THREE.Shape();s.moveTo(-.8*L,0);s.lineTo(-1.5*L,h*1.5);s.quadraticCurveTo(-1.25*L,0,-1.5*L,-h*1.5);s.closePath();G.add(new THREE.Mesh(ext(s,.04*L),fm));
 s=new THREE.Shape();s.moveTo(.35*L,h*.6);s.quadraticCurveTo(0,h*2.4*(o.dor||1),-.5*L,h*.6);s.closePath();G.add(new THREE.Mesh(ext(s,.04*L),fm));
 const e=MS_({color:'#fff'}),k=MS_({color:'#000'});for(const z of[-1,1]){G.add(sphere(.1*L,e,.62*L,.2*h,z*.5*h));G.add(sphere(.055*L,k,.66*L,.2*h,z*.55*h))}
 return G}
const PAL=['#ff9800','#ff5252','#40c4ff','#69f0ae','#ffd740','#e040fb'];
const T={
fish:{s:.9,h:4,sc:10,w:5,y:[0,180],b:s=>fishM(s,pick(PAL),'#fff3d6')},
tuna:{s:1.7,h:9,sc:25,w:3,y:[20,250],b:s=>fishM(s,'#2a4f8f','#e3ebf7',{w:.3})},
gold:{s:1.1,h:6,sc:50,co:20,w:.3,y:[10,320],b:s=>fishM(s,'#ffb300','#fff59d',{em:'#ff9800'})},
diver:{s:2.3,h:16,sc:60,co:5,w:1,y:[6,150],b:s=>{const G=new THREE.Group(),sk=MS_({color:'#ffcc99'}),w=MS_({color:'#ff7043',roughness:.5});
  const t=new THREE.Mesh(new THREE.CapsuleGeometry(.2*s,.5*s,4,8),w);t.rotation.z=Math.PI/2;G.add(t);G.add(sphere(.17*s,sk,.52*s,0,0));G.add(sphere(.1*s,MS_({color:'#4fc3f7',metalness:.6,roughness:.2}),.62*s,.03*s,0,1,1,1.4));
  const tk=new THREE.Mesh(new THREE.CylinderGeometry(.09*s,.09*s,.5*s,10),MS_({color:'#90a4ae',metalness:.6}));tk.rotation.z=Math.PI/2;tk.position.set(0,.26*s,0);G.add(tk);
  const lg=new THREE.Group();for(const z of[-1,1]){const l=new THREE.Mesh(new THREE.CapsuleGeometry(.07*s,.45*s,3,6),w);l.rotation.z=Math.PI/2;l.position.set(-.55*s,0,z*.1*s);lg.add(l);const f=new THREE.Mesh(new THREE.BoxGeometry(.3*s,.02*s,.18*s),MS_({color:'#263238'}));f.position.set(-.9*s,0,z*.1*s);lg.add(f)}G.add(lg);G.userData.lg=lg;return G}},
seal:{s:3,h:22,sc:90,w:1,y:[10,180],b:s=>{const G=fishM(s,'#6d4c41','#d7ccc8',{w:.52}),f=MS_({color:'#5d4037'});for(const z of[-1,1])G.add(sphere(1,f,.3*s,-.3*s,z*.33*s,.25*s,.06*s,.12*s));return G}},

  const tt=new THREE.Group();for(let i=0;i<6;i++){const g=new THREE.CylinderGeometry(.03*s,.05*s,.9*s,5);g.translate(0,-.45*s,0);const q=new THREE.Mesh(g,m);q.rotation.z=Math.PI/2+rnd(-.2,.2);q.rotation.y=i/6*6.28;q.position.x=-.5*s;tt.add(q)}G.add(tt);G.userData.tt=tt;
  for(const z of[-1,1])G.add(sphere(.07*s,MS_({color:'#fff'}),.2*s,.12*s,z*.22*s));return G}},
orca:{s:7,h:50,sc:400,co:30,w:.35,boss:1,y:[60,320],b:s=>{const G=fishM(s,'#10151c','#f5f7fa',{w:.34,dor:2.3}),wp=MS_({color:'#fff'});for(const z of[-1,1])G.add(sphere(1,wp,.55*s,.1*s,z*.2*s,.14*s,.05*s,.06*s));return G}},
jelly:{s:2,hz:1,dmg:10,sc:15,w:1.2,y:[30,360],b:s=>{const G=new THREE.Group(),m=MS_({color:'#e1a0ff',transparent:true,opacity:.7,emissive:'#b040ff',emissiveIntensity:.7,side:THREE.DoubleSide});const d=new THREE.Mesh(new THREE.SphereGeometry(.6*s,16,10,0,6.28,0,1.6),m);G.add(d);G.add(sphere(.25*s,MS_({color:'#fff',emissive:'#fff',emissiveIntensity:.6}),0,.1*s,0));
  const tt=new THREE.Group();for(let i=0;i<7;i++){const g=new THREE.CylinderGeometry(.02*s,.04*s,1.3*s,5);g.translate(0,-.65*s,0);const q=new THREE.Mesh(g,m);const a=i/7*6.28;q.position.set(Math.cos(a)*.35*s,0,Math.sin(a)*.35*s);tt.add(q)}G.add(tt);G.userData.tt=tt;G.userData.up=1;return G}},
puff:{s:1.5,hz:1,dmg:8,sc:15,w:1,y:[8,200],b:s=>{const G=new THREE.Group(),m=MS_({color:'#c5e1a5',roughness:.5}),sp=MS_({color:'#7cb342'});G.add(sphere(.55*s,m,0,0,0));

  for(const z of[-1,1]){G.add(sphere(.12*s,MS_({color:'#fff'}),.4*s,.15*s,z*.4*s));G.add(sphere(.06*s,MS_({color:'#000'}),.45*s,.15*s,z*.43*s))}return G}},

  e.m.rotation.y=lp(e.m.rotation.y,e.dir>0?0:Math.PI,Math.min(1,6*dt));if(!t.hz&&!t.fixed&&!t.coin)e.m.rotation.z=Math.sin(e.ph*.5)*.08;
  anim(e,dt);
  const ed=!t.hz&&e.s<=u*1.15;if(ed&&Math.hypot(e.x-hx,e.y-hy)<u*3.4)near=true;
  if(Math.hypot(e.x-hx,e.y-hy)<e.s*(t.coin?1:.8)+u*.65){
   if(t.coin||fzT>0||ed)eat(e,i);
   else{hurt(t.dmg||25);if(e.k=='mine'){for(let j=0;j<24;j++)fx(e.x,e.y,0,rnd(-9,9),rnd(-9,9),rnd(-4,4),.8,pick(['#ff9800','#ffeb3b','#fff']));kill(i)}}}}
 for(let i=0;i<3;i++){const m=MSN[i];if(m.k()>=tgt(i)){S.coins+=m.r;S.m[i]++;pop('Mission complete! +'+m.r,P.x,P.y+5,0,'#69f0ae');save()}}
 const spd=Math.hypot(P.vx,P.vy);wph+=dt*(4+spd*.45);uPh.value=wph;

 if(spd>8&&P.y<0&&Math.random()<.4)fx(P.x-P.f*u*1.5,P.y,rnd(-1,1),0,rnd(.5,2),0,1,'#bfefff');
 camZ=lp(camZ,20+u*3.2,Math.min(1,2*dt));camX=lp(camX,P.x+P.f*3,Math.min(1,3*dt));camY=lp(camY,cl(P.y+1,-DEPTH+hh*.9,hh*.35),Math.min(1,4*dt));

 $('#ms').innerHTML=MSN.map((m,i)=>`${m.t}: ${Math.min(m.k()|0,tgt(i))}/${tgt(i)}`).join('<br>');
}
